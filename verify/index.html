<div id="formView">
<form id="f" style="display:grid;gap:18px">

<h1>Is this certificate real?</h1>
<p>Enter the certificate ID printed at the bottom left of the certificate.</p>

<div class="ok" id="okView" hidden><span class="tick"><svg class="ico"><use href="#i-check"/></svg></span><h1>Verified.</h1><p>This certificate was issued by AI Beyond the Chatbox.</p>
<div class="facts" id="facts"></div><button class="btn ghost" id="again" type="button">Check another ID</button></div>
<p class="foot">Questions about a certificate? <a href="https://wa.me/601110682544" target="_blank" rel="noopener">WhatsApp us</a>.</p>
</main>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxad2ugFPJ1kPqEXEMzr0Gth8CPIjaBw0CP8rvPbPUV2PFCR-669Ep9YYf99qpA9nBh/exec';
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err'), cid = document.getElementById('cid');
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = v => { const m = String(v).toUpperCase().replace(/\s/g, '').match(/^(?:ABTC-?)?C?-?(\d{1,4})$/); return m ? 'ABTC-C' + m[1].padStart(4, '0') : String(v).toUpperCase().trim(); };
async function check() {
  err.hidden = true;
  const id = norm(cid.value); cid.value = id;
  if (!/^ABTC-C\d{4}$/.test(id)) { err.textContent = 'Certificate IDs look like ABTC-C0042.'; err.hidden = false; return; }
  go.disabled = true; go.innerHTML = '<span class="spin"></span>Checking…';
  try {
    const r = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({ action: 'verify', id }) }).then(x => x.json());
    if (r.ok) {
      document.getElementById('facts').innerHTML = [['Awarded to', r.name], ['Workshop', r.workshop], ['Completed on', r.date], ['Certificate ID', r.id]].filter(x => x[1]).map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('');
      document.getElementById('formView').hidden = true; document.getElementById('okView').hidden = false;
      try { history.replaceState(null, '', '?id=' + id); } catch (x) {}
    } else {
      err.textContent = r.error === 'notfound' ? 'No certificate has this ID. Check each character, or message us and we\'ll look into it.' : 'Certificate IDs look like ABTC-C0042.';
      err.hidden = false;
    }
  } catch (x) { err.textContent = 'Couldn\'t connect. Check your internet and try again.'; err.hidden = false; }
  go.disabled = false; go.innerHTML = '<svg class="ico"><use href="#i-search"/></svg>Check this ID';
}
