<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · AI Beyond the Chatbox</title><link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png"><link rel="icon" type="image/svg+xml" href="../assets/icon.svg"><link rel="apple-touch-icon" href="../assets/icon-180.png"><meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Courier+Prime:wght@700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* Admin CRM for the workshop. Data lives in Ayman's Google Sheet; this page reads and writes it through the
   Apps Script web app, unlocked with the Admin key from the Settings tab. Nothing is stored here except that key. */
body{min-height:100vh}
.lockscreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#131834,#1B2350 50%,#2B4ACB 130%);color:var(--cream)}
.lockcard{width:min(440px,100%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:34px;display:grid;gap:18px;animation:up .5s var(--ease)}
.lockcard h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:42px;line-height:1}
.lockcard p{color:#C9CCDA}
.lockcard input{background:#fff;color:var(--ink);letter-spacing:.08em}
.lockcard .err{color:#FFB4AB;font-weight:600}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--night);color:var(--cream);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.side .brand{font-size:16px;padding:0 8px}
.side nav{display:grid;gap:4px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#C9CCDA;font-weight:600;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.side nav button:hover{background:rgba(243,234,216,.07);color:var(--cream)}
.side nav button.on{background:var(--blue);color:#fff}
.side nav .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
.side .foot{margin-top:auto;display:grid;gap:8px;font-size:13px;color:#8F95AE}
.side .foot button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C9CCDA;cursor:pointer;padding:8px;border-radius:10px}
.side .foot button:hover{background:rgba(243,234,216,.07)}
main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(32px,4vw,44px);line-height:1}
.top .meta{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13.5px}
.view{animation:up .4s var(--ease)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:6px;min-width:0}
.kpi .mono{color:var(--blue);display:flex;align-items:center;gap:8px}
.kpi b{font-size:clamp(26px,3vw,34px);font-weight:900;letter-spacing:-.03em;color:var(--navy);line-height:1.1}
.kpi span{color:var(--mut);font-size:13px}
.kpi.dark{background:var(--navy);border-color:var(--navy)}.kpi.dark b{color:var(--cream)}.kpi.dark .mono{color:var(--lb)}.kpi.dark span{color:#C9CCDA}
.bar{height:6px;border-radius:99px;background:rgba(243,234,216,.18);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lb),#fff);border-radius:inherit;transition:width .8s var(--ease)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:20px 22px;min-width:0}
.panel h2{font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel h2 .pill{margin-left:auto}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.sec-title{margin:28px 0 12px;color:var(--blue)}
.attn{display:grid;gap:8px}
.attn .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.attn .row b{display:block}.attn .row small{color:var(--mut)}
.attn .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--mut);padding:14px 0;display:flex;align-items:center;gap:10px}
.links{display:grid;gap:6px}
.links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--navy);text-decoration:none;font-weight:600;transition:background .2s}
.links a:hover{background:var(--tint)}.links a .ico{color:var(--blue)}.links a .ext{margin-left:auto;color:var(--soft)}
.bulk{display:grid;gap:8px}
.bulk .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.bulk .row div{flex:1;min-width:0}.bulk small{display:block;color:var(--mut)}.bulk .n{font-weight:800;color:var(--navy);min-width:30px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft)}
.search input{padding-left:42px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.2s}
.chips button:hover{border-color:var(--line2)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chips button span{opacity:.7;font-weight:500}
.tablewrap{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{position:sticky;top:0;background:var(--navy);color:var(--cream);text-align:left;font-size:12.5px;font-weight:700;padding:12px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--tint)}
td.name b{display:block}td.name small{color:var(--mut)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.drawer{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(16,21,44,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheetx{width:min(640px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--cream);border-radius:26px;padding:26px;display:grid;align-content:start;gap:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:popin .3s var(--ease)}
@keyframes popin{from{transform:translateY(14px) scale(.97);opacity:0}}
@media (max-width:560px){.drawer{padding:12px}.sheetx{padding:20px;border-radius:22px;max-height:calc(100vh - 24px)}}
.sheetx header{display:flex;align-items:flex-start;gap:12px}
.sheetx header h2{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:34px;line-height:1;flex:1}
.x{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:#fff;cursor:pointer;flex:none}
.x:hover{background:var(--tint)}
.kv{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.kv div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv dt{color:var(--mut)}.kv dd{font-weight:600;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(16,21,44,.55);animation:fade .2s}
.modal .box{width:min(480px,100%);background:var(--white);border-radius:22px;padding:24px;display:grid;gap:14px;animation:up .3s var(--ease)}
.modal h3{font-size:19px}
.modal ul{max-height:220px;overflow:auto;margin-left:18px;color:var(--mut);font-size:14px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.elist{display:grid;gap:8px;align-content:start}
.ecard{display:grid;gap:3px;text-align:left;padding:13px 15px;border-radius:16px;background:var(--white);border:1.5px solid var(--line);cursor:pointer;transition:.2s}
.ecard:hover,.ecard.on{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.ecard b{font-size:15px}.ecard small{color:var(--mut)}
.ecard .tag{justify-self:start}
iframe{width:100%;height:calc(100vh - 40px);min-height:520px;border:0;border-radius:20px;background:#F4EFE4;border:1px solid var(--line);position:sticky;top:20px}
.egrid{align-items:start}
.egrid{grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
.form{display:grid;gap:22px}
.fgroup{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:grid;gap:16px}
.fgroup h3{font-size:16px;color:var(--navy)}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14.5px}
.field .fmt{font-size:12.5px;color:var(--mut)}
.field .fmt b{color:var(--ink);font-weight:600}
.field.ro input{background:var(--paper);color:var(--mut)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.save{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px}
.log td{font-size:13px}
.guide{display:grid;gap:12px;max-width:820px}
.guide .panel p,.guide .panel li{color:var(--ink)}
.guide ol,.guide ul{margin-left:20px;display:grid;gap:6px}
.statusmap{display:grid;gap:8px}
.statusmap div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.mobilenav{display:none}
.dwrap{display:grid;gap:22px}.dwrap .sec-title{margin:8px 0 -8px}.dwrap .panel h2{margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{background:var(--white);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.dcard .thumb{display:block;aspect-ratio:4/3;background:var(--tint);overflow:hidden}
.dcard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .35s}
.dcard .thumb:hover img{transform:scale(1.03)}
.dcard .thumb.fit{background:#E9E3D3}.dcard .thumb.fit img{object-fit:contain;padding:14px}.dcard .thumb.dark{background:linear-gradient(170deg,#131834,#1B2350 55%,#2B4ACB 130%)}.dcard .thumb.dark img{object-fit:contain;padding:22px}
.dcard .body{padding:14px 16px 16px;display:grid;gap:6px;flex:1;align-content:start}
.dcard .body b{font-size:16px}.dcard .body small{color:var(--mut);font-size:13px;line-height:1.45}
.dcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.lgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px}
.lrow:hover{background:var(--tint)}.lrow>.ico{color:var(--blue);flex:none}
.lrow div{flex:1;min-width:0}.lrow b{display:block;font-size:14.5px}.lrow small{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--white);color:var(--navy);cursor:pointer;flex:none;text-decoration:none}
.lrow .x:hover{border-color:var(--blue);color:var(--blue)}
.lrow.off{opacity:.55}.paths code{font-family:'Courier Prime',monospace;font-size:12.5px;background:var(--tint);padding:2px 6px;border-radius:6px;word-break:break-all}
.cohortsel{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-weight:600;font-size:13.5px}
.cohortsel select{border:0;min-height:30px;padding:0 26px 0 6px;font-weight:700;background:transparent;width:auto;box-shadow:none;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ccard{background:var(--white);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:10px;transition:.2s}
.ccard.on{border-color:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.ccard header{display:flex;align-items:center;gap:10px}.ccard header b{font-size:18px;flex:1}
.ccard .meta{display:grid;gap:4px;color:var(--mut);font-size:13.5px}
.ccard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.p-open{background:var(--ok-bg);color:var(--ok)}.p-draft{background:#ECEAE4;color:var(--mut)}.p-closed{background:var(--warn-bg);color:var(--warn)}.p-done{background:var(--tint);color:var(--blue)}
.signing{display:grid;place-items:center;gap:14px;color:var(--cream)}
.hist{display:grid;gap:6px}.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--white);border:1px solid var(--line);font-size:13.5px}.hist span{color:var(--mut)}
.skel{height:110px;border-radius:20px;background:linear-gradient(90deg,#EFE6D2,#F7F0E2,#EFE6D2);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.egrid{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobilenav{display:flex;position:sticky;top:0;z-index:40;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--night);scrollbar-width:none}
  .mobilenav button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:rgba(243,234,216,.08);color:#C9CCDA;font-weight:600;font-size:13.5px}
  .mobilenav button.on{background:var(--blue);color:#fff}
  .f2{grid-template-columns:1fr}
  .kv div,.statusmap div{grid-template-columns:1fr;gap:2px}
  iframe{height:70vh;min-height:0}
}
</style></head><body>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxad2ugFPJ1kPqEXEMzr0Gth8CPIjaBw0CP8rvPbPUV2PFCR-669Ep9YYf99qpA9nBh/exec';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = n => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const PILL = { 'Pending payment': 'pending', 'Paid': 'paid', 'Not found': 'notfound', 'Released': 'released', 'Refunded': 'refunded' };
const pill = st => `<span class="pill p-${PILL[st] || 'released'}"><i></i>${esc(st || 'No status')}</span>`;
const rm = n => 'RM' + Number(n || 0).toLocaleString('en-MY');
const when = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString('en-MY', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); };
const hoursAgo = iso => (Date.now() - new Date(iso)) / 36e5;
let KEY = ''; try { KEY = localStorage.getItem('abtc-admin') || ''; } catch (e) {}
let D = null, VIEW = 'overview', FILTER = 'All', Q = '', EMAIL = 'howToPay', COHORT = '';

function toast(msg, err) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.innerHTML = (err ? ico('circle-alert') : ico('circle-check')) + `<span>${esc(msg)}</span>`; document.body.append(t); setTimeout(() => t.remove(), 4200); }
async function api(op, extra = {}) {
  const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'admin', key: KEY, op }, extra)) }).then(r => r.json());
  if (!res.ok && res.error === 'key') { lock('That key no longer works. Check the Admin key on the Settings tab.'); throw new Error('key'); }
  return res;
}
function lock(msg) { try { localStorage.removeItem('abtc-admin'); } catch (e) {} KEY = ''; $('#app').hidden = true; $('#lock').hidden = false; if (msg) { $('#lockErr').textContent = msg; $('#lockErr').hidden = false; } }
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault(); KEY = $('#keyIn').value.trim(); const b = $('#lockBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Checking…';
  try { const r = await load(true); if (r) { try { localStorage.setItem('abtc-admin', KEY); } catch (x) {} } }
  catch (x) { if (x.message !== 'key') { $('#lockErr').textContent = 'Could not reach the Sheet. Check your connection.'; $('#lockErr').hidden = false; } }
  b.disabled = false; b.innerHTML = ico('key-round') + 'Unlock';
});
$('#lockOut').addEventListener('click', () => lock());
$('#refresh').addEventListener('click', () => load());
$('#cohortSel').addEventListener('change', e => { COHORT = e.target.value; load(); });

async function load(first) {
  if (!first) $('#refresh').innerHTML = '<span class="spin dark"></span>Refreshing';
  const r = await api('load', COHORT ? { cohort: COHORT } : {});
  $('#refresh').innerHTML = ico('refresh-cw') + 'Refresh';

  </div>
  <div class="panel" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${ico('book-open')}<div style="flex:1;min-width:220px"><b>Brand guide</b><p class="hint">How to use the wordmark, colours, fonts, tone of voice and icons. Private until you share it from its Share menu.</p></div>${open(BRAND_GUIDE, 'Open brand guide')}</div>

      ${link('message-square', 'WhatsApp group · ' + esc(COHORT), c['WhatsApp group link'], c['WhatsApp group link'] ? '' : 'Set it in Cohorts')}
      ${link('credit-card', 'Payment link', set('Payment link'), set('Payment link') ? '' : 'Set it in Settings')}
      ${link('qr-code', 'DuitNow QR image', site + 'assets/duitnow-qr.png')}
    </div>
    <div class="panel"><h2>${ico('lock')}For you</h2>
      ${link('layout-dashboard', 'This admin page', site + 'admin/')}
      ${link('file-text', 'Google Sheet (the database)', L.sheet, 'Registrations, Cohorts, Settings, Email log')}
      ${link('inbox', 'Receipts and certificates folder', L.files)}
      ${link('lock', 'Student cards (private)', L.cards, L.cards ? 'Delete after the session: Cohorts tab' : '')}
      ${link('star', 'Certificate template (Slides)', L.certTemplate, L.certTemplate ? '' : 'Made by "Use the new design" in Cohorts')}

  </div>
  <div class="panel paths"><h2>${ico('download')}Files on your Mac</h2><p class="hint" style="margin-bottom:10px">Inside the "AI Beyond the Chatbox" folder:</p><ul>
    <li>Posters (full size): <code>5 Deliverables/PERSONAL AI Beyond the Chatbox Posters/</code></li>
    <li>Proposal for Adam: <code>5 Deliverables/PERSONAL AI Beyond the Chatbox Proposal v5.pdf</code></li>
    <li>Slides: <code>5 Deliverables/PERSONAL AI Beyond the Chatbox Deck v1.html</code></li>

}

/* ---------- emails ---------- */
function emails() {
  const how = h => h.startsWith('Auto') ? 'p-paid' : h.startsWith('Status') ? 'p-refunded' : 'p-pending';
  const cur = D.emails.find(e => e.key === EMAIL) || D.emails[0];
  return `<div class="toolbar"><p class="hint" style="flex:1">Every email the system sends. Green = automatic, blue = when you change a status, yellow = you send it from the Overview.</p><button class="btn dark" data-previewall>${ico('send')}Send all to me</button></div>
  <div class="grid egrid"><div class="elist">${D.emails.map(e => `<button class="ecard ${e.key === cur.key ? 'on' : ''}" data-email="${e.key}"><span class="pill ${how(e.how)} tag">${esc(e.how)}</span><b>${esc(e.name)}</b><small>${esc(e.when)}</small><small>Sent ${e.sent} time${e.sent === 1 ? '' : 's'}</small></button>`).join('')}</div>
  <iframe src="${esc(cur.preview)}" title="Email preview"></iframe></div>`;
}

/* ---------- settings ---------- */
const GROUPS = [['Registration', ['Registration paused', 'Payment link']], ['Contact', ['Contact WhatsApp', 'Contact email', 'Workshop name', 'Level 2 note']], ['Testing', ['Test payment code']]];
function settings() {
  const S = Object.fromEntries(D.settings.map(s => [s.key, s]));
  const label = k => k.replace(/ \(.*\)$/, '');
  const input = s => s.key === 'Registration paused' ? `<select data-set="${esc(s.key)}"><option ${String(s.value) !== 'Yes' ? 'selected' : ''}>No</option><option ${String(s.value) === 'Yes' ? 'selected' : ''}>Yes</option></select>`
    : `<input type="${/YYYY-MM-DD/.test(s.key) ? 'date' : /HH:MM/.test(s.key) ? 'time' : /Price|Seat cap|Duration/.test(s.key) ? 'number' : 'text'}" data-set="${esc(s.key)}" value="${esc(s.value)}" placeholder="${esc(s.example || '')}">`;
  return `<div class="form"><div class="panel" style="display:flex;gap:12px;align-items:center">${ico('calendar')}<span style="flex:1">Date, time, meeting link, WhatsApp group, seats, early bird and prices are set per cohort.</span><button class="btn sm" data-go="cohorts">Open Cohorts</button></div>${GROUPS.map(([g, keys]) => `<section class="fgroup"><h3>${g}</h3><div class="f2">${keys.filter(k => S[k]).map(k => { const s = S[k]; return `<div class="field"><label>${esc(label(k))}</label>${input(s)}<span class="fmt">${s.format ? `<b>${esc(s.format)}</b> · e.g. ${esc(s.example)}` : ''}${s.note ? (s.format ? '<br>' : '') + esc(s.note) : ''}</span></div>`; }).join('')}</div></section>`).join('')}
  <section class="fgroup"><h3>Set by the system</h3><div class="f2">${D.settings.filter(s => !s.editable).map(s => `<div class="field ro"><label>${esc(s.key)}</label><input type="text" value="${esc(s.value)}" readonly><span class="fmt">${esc(s.note || '')}</span></div>`).join('')}</div></section>
  <div class="save"><button class="btn" data-save>${ico('circle-check')}Save settings</button></div></div>`;
}

/* ---------- activity ---------- */
function activity() {
  return `<div class="tablewrap log"><table><thead><tr><th>Time</th><th>To</th><th>Email</th><th>Result</th><th>Detail</th></tr></thead><tbody>
  ${D.log.length ? D.log.map(l => `<tr><td class="num">${esc(l.time)}</td><td>${esc(l.to)}</td><td>${esc(l.email)}</td><td>${l.result === 'Sent' ? '<span class="pill p-paid"><i></i>Sent</span>' : `<span class="pill p-notfound"><i></i>${esc(l.result)}</span>`}</td><td>${esc(l.detail)}</td></tr>`).join('') : '<tr><td colspan="5"><p class="empty">Nothing yet.</p></td></tr>'}
  </tbody></table></div>`;
}

  return `<div class="guide">
  <div class="panel"><h2>${ico('list-checks')}Every day</h2><ol><li>Open <b>Overview → Payments to check</b>.</li><li>Find each payment reference and amount on your Touch 'n Go statement. For students, open the card first.</li><li>Matched? <b>Mark paid</b>. Can't find it? <b>Not found</b>. Still not found after 72 hours? <b>Release</b>.</li></ol></div>
  <div class="panel"><h2>${ico('circle-dot')}What each status does</h2><div class="statusmap">
    <div>${pill('Pending payment')}<span>Every new registration starts here. They got "Registration received". Nothing is sent when you set it.</span></div>
    <div>${pill('Paid')}<span>Sends the confirmation with the receipt PDF and calendar invite.</span></div>
    <div>${pill('Not found')}<span>Asks them to reply with their receipt. If they still haven't sorted it, send the reminder with the QR from Send to everyone.</span></div>
    <div>${pill('Released')}<span>Tells them the seat was released. The seat opens up on the website.</span></div>
    <div>${pill('Refunded')}<span>Marks the refund. No email. Do the bank transfer yourself; pay-later refunds go through Touch 'n Go.</span></div></div>
    <p class="hint" style="margin-top:12px">Emails go out the moment you press a button. They cannot be unsent.</p></div>
  <div class="panel"><h2>${ico('clock')}Automatic vs. you</h2><ul><li><b>Automatic:</b> only "Registration received, we're checking your payment", the moment someone registers.</li><li><b>You confirm:</b> everything else. Under <b>Overview → Send to everyone</b>, items show <b>Due</b> when it's time (payment reminders, one week before, the day before, thank-yous). Review the list, then send.</li></ul></div>
  <div class="panel"><h2>${ico('user-check')}On the day</h2><ul><li>Start: post the <b>check-in page</b> link in the meeting chat (Quick links).</li><li>End: post the <b>feedback page</b> link.</li><li>Same evening: <b>Send to everyone → Thank-you emails</b>. Next day: feedback reminders, then certificates.</li></ul></div>
  <div class="panel"><h2>${ico('key-round')}Testing</h2><p>Put a secret code in <b>Settings → Test payment code</b>. A registration with that exact code as its payment reference is confirmed at once and marked TEST. Clear the code when you're done.</p></div>
  <div class="panel"><h2>${ico('lock')}Your data</h2><p>Everything lives in your Google Sheet. This page only shows it after the admin key unlocks it, and only keeps the key on this device. To lock every device out, change the Admin key on the Settings tab.</p></div>
  </div>`;
}

/* ---------- actions ---------- */
function confirmBox(title, body, okLabel, kind) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog"><h3>${esc(title)}</h3><div class="hint" style="font-size:14px">${body}</div><div class="row"><button class="btn ghost" data-no>Cancel</button><button class="btn ${kind || ''}" data-yes>${okLabel}</button></div></div>`;
    document.body.append(m);
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-no]')) { m.remove(); res(false); } if (e.target.closest('[data-yes]')) { m.remove(); res(true); } });
  });
}
const busy = (b, on, txt) => { if (!b) return; if (on) { b.dataset.html = b.innerHTML; b.disabled = true; b.innerHTML = `<span class="spin${b.classList.contains('ghost') ? ' dark' : ''}"></span>${txt || 'Working…'}`; } else { b.disabled = false; b.innerHTML = b.dataset.html; } };
function wire(root = document) {
  $$('[data-open]', root).forEach(el => el.addEventListener('click', e => { if (e.target.closest('button[data-status]')) return; openRow(el.dataset.open); }));
  $$('[data-filter]', root).forEach(b => b.addEventListener('click', () => { FILTER = b.dataset.filter; render(); }));
  const q = $('#q', root); if (q) { q.addEventListener('input', () => { Q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }); }
  $$('[data-email]', root).forEach(b => b.addEventListener('click', () => { EMAIL = b.dataset.email; render(); }));
  $$('[data-status]', root).forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    const r = D.rows.find(x => x.ID === b.dataset.id), st = b.dataset.status;
    const what = { 'Paid': `This emails <b>${esc(r.Email)}</b> their confirmation, receipt and calendar invite.`, 'Not found': `This emails <b>${esc(r.Email)}</b> to resend their payment reference.`, 'Released': `This emails <b>${esc(r.Email)}</b> that their seat was released.`, 'Refunded': 'No email is sent. Do the transfer yourself.' }[st];
    if (!await confirmBox(`${st === 'Paid' ? 'Mark paid' : st} · ${r.Name}?`, `${what}<br><br>Reference <b>${esc(r['Payment ref'])}</b> · ${rm(r['Amount (RM)'])}`, st === 'Paid' ? 'Mark paid and send' : st === 'Refunded' ? 'Mark refunded' : 'Send', st === 'Paid' ? 'green' : st === 'Released' ? 'dark' : '')) return;
    busy(b, true, 'Sending…');
    try { const res = await api('setStatus', { id: r.ID, status: st }); if (res.ok) { toast(res.message); Object.assign(r, res.row); $$('.drawer').forEach(d => d.remove()); render(); } else toast('Could not update: ' + (res.message || res.error), true); }
    catch (x) { if (x.message !== 'key') toast('Could not reach the Sheet.', true); }
    busy(b, false);
  }));
  $$('[data-note]', root).forEach(b => b.addEventListener('click', async () => {
    busy(b, true, 'Saving…');
    try { const res = await api('saveNote', { id: b.dataset.note, note: $('#note').value }); if (res.ok) { Object.assign(D.rows.find(x => x.ID === b.dataset.note), res.row); toast('Note saved.'); } else toast('Could not save.', true); } catch (x) {}
    busy(b, false);
  }));
  $$('[data-resend]', root).forEach(b => b.addEventListener('click', async () => {
    const r = D.rows.find(x => x.ID === b.dataset.id);
    if (!await confirmBox('Send this email again?', `It goes to <b>${esc(r.Email)}</b>.`, 'Send again')) return;
    busy(b, true, 'Sending…');
    try { const res = await api('resend', { id: r.ID, template: b.dataset.resend }); toast(res.ok ? res.message : 'Could not send.', !res.ok); } catch (x) {}
    busy(b, false);
  }));
  $$('[data-bulk]', root).forEach(b => b.addEventListener('click', async () => {
    busy(b, true, 'Loading…');
    let p; try { p = await api('bulkPreview', { bulk: b.dataset.bulk, cohort: COHORT }); } catch (x) { busy(b, false); return; }
    busy(b, false);
    if (p.guard) return toast(p.guard, true);
    const list = `<ul>${p.people.map(x => `<li>${esc(x.name)} · ${esc(x.email)}</li>`).join('')}</ul>`;
    if (!await confirmBox(`${p.label}?`, `${p.people.length} ${p.people.length === 1 ? 'person' : 'people'} will get it now:${list}`, 'Send now')) return;
    busy(b, true, 'Sending…');
    try { const res = await api('bulkRun', { bulk: b.dataset.bulk, cohort: COHORT }); toast(res.ok ? res.message : (res.message || 'Could not send.'), !res.ok); if (res.ok) load(); } catch (x) {}
    busy(b, false);
  }));
  $$('[data-previewall]', root).forEach(b => b.addEventListener('click', async () => {
    if (!await confirmBox('Send every email to yourself?', 'One of each email goes to your contact email, with sample details.', 'Send all')) return;
    busy(b, true, 'Sending…'); try { const res = await api('previewAll'); toast(res.ok ? res.message : 'Could not send.', !res.ok); } catch (x) {} busy(b, false);
  }));
  $$('[data-go]', root).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $$('[data-copy]', root).forEach(b => b.addEventListener('click', async () => {
    const v = b.dataset.copy;
    try { await navigator.clipboard.writeText(v); toast('Link copied.'); }
    catch (x) { const t = document.createElement('textarea'); t.value = v; document.body.append(t); t.select(); try { document.execCommand('copy'); toast('Link copied.'); } catch (y) { toast(v); } t.remove(); }
  }));
  $$('[data-newcohort]', root).forEach(b => b.addEventListener('click', () => cohortForm(null)));
  $$('[data-editcohort]', root).forEach(b => b.addEventListener('click', () => cohortForm(D.cohorts.find(c => c.Code === b.dataset.editcohort))));
  $$('[data-viewcohort]', root).forEach(b => b.addEventListener('click', () => { COHORT = b.dataset.viewcohort; load(); }));
  $$('[data-opencohort]', root).forEach(b => b.addEventListener('click', async () => {
    const code = b.dataset.opencohort;
    if (!await confirmBox(`Open ${code} on the website?`, 'New registrations go to this cohort, and the site shows its date, seats and prices. Any other open cohort is closed.', 'Open it', 'green')) return;
    busy(b, true, 'Opening…'); try { const res = await api('saveCohort', { code, values: { Status: 'Open' } }); toast(res.ok ? res.message.replace('Saved', 'Opened') : 'Could not open.', !res.ok); if (res.ok) { COHORT = code; load(); } } catch (x) {} busy(b, false);
  }));
  $$('[data-cleartest]', root).forEach(b => b.addEventListener('click', async () => {
    const c = D.cohorts.find(x => x.Code === COHORT) || {}, isTest = /^y/i.test(c['Test cohort']);
    const n = D.rows.filter(r => isTest || /TEST/.test(r.Notes)).length;
    if (!n) return toast('No test registrations in this cohort.');
    if (!await confirmBox(`Delete ${n} test registration${n === 1 ? '' : 's'}?`, `From ${esc(COHORT)}. Their rows are removed from the Sheet and any card photos go to the Drive bin. This can't be undone here.`, 'Delete', 'red')) return;
    busy(b, true, 'Deleting…'); try { const res = await api('clearTest', { cohort: COHORT }); toast(res.ok ? res.message : 'Could not delete.', !res.ok); if (res.ok) load(); } catch (x) {} busy(b, false);
  }));
  $$('[data-delcards]', root).forEach(b => b.addEventListener('click', async () => {
    const n = D.rows.filter(r => /drive\.google\.com/.test(r['Student card'])).length;
    if (!n) return toast('No student cards stored for this cohort.');
    if (!await confirmBox(`Delete ${n} student card${n === 1 ? '' : 's'}?`, 'Do this after the session. The photos move to the Drive bin (emptied by Google after 30 days).', 'Delete', 'red')) return;
    busy(b, true, 'Deleting…'); try { const res = await api('deleteCards', { cohort: COHORT }); toast(res.ok ? res.message : 'Could not delete.', !res.ok); if (res.ok) load(); } catch (x) {} busy(b, false);
  }));
  $$('[data-certnew]', root).forEach(b => b.addEventListener('click', async () => {
    if (!await confirmBox('Use the new certificate design?', 'Makes a new certificate template from the poster-style artwork. The old template stays in Drive.', 'Use it')) return;
    busy(b, true, 'Building…'); try { const res = await api('rebuildCertificate'); toast(res.ok ? res.message : 'Could not build. Google may ask you to allow access in Apps Script first.', !res.ok); if (res.ok) load(); } catch (x) {} busy(b, false);
  }));
  $$('[data-certprev]', root).forEach(b => b.addEventListener('click', async () => {
    busy(b, true, 'Making PDF…'); try { const res = await api('certificatePreview', { cohort: COHORT }); if (res.ok) { toast(res.message); window.open(res.url, '_blank', 'noopener'); } else toast('Could not make the preview.', true); } catch (x) {} busy(b, false);
  }));
  $$('[data-save]', root).forEach(b => b.addEventListener('click', async () => {
    const values = {}; $$('[data-set]').forEach(i => { values[i.dataset.set] = i.value; });
    busy(b, true, 'Saving…');
    try { const res = await api('saveSettings', { values }); if (res.ok) { D.settings = res.settings; toast(res.message); load(); } else toast('Could not save.', true); } catch (x) {}
    busy(b, false);
  }));
}

if (KEY) { $('#lock').hidden = true; $('#signing').hidden = false; load(true).catch(() => {}).finally(() => { $('#signing').hidden = true; if ($('#app').hidden) $('#lock').hidden = false; }); }
</script>
